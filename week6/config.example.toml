# All filesystem overrides must be absolute. Defaults resolve beside the binaries.
# state = "/absolute/path/week6/data/state"
# indexer = "/absolute/path/week6/scripts/repo_index.py"
# git_mcp = "/absolute/path/week6/git-mcp"
python = "python3"
endpoint = "https://api.deepseek.com/chat/completions"
model = "deepseek-v4-flash"
ollama = "http://127.0.0.1:11434"
embedding_model = "embeddinggemma:300m"
timeout_seconds = 300
# Bundled data MCP is auto-detected. Override with an absolute path, or disable
# with data_mcp = "". Enables real account writes
# only in advent-agent, never in support-bot. Restart the daemon after changing it.
# data_mcp = "/absolute/path/healbe-data-mcp.app/Contents/MacOS/healbe-data-mcp"

# Private JSON {"login": "...", "password": "..."}, mode 0600.
# Defaults to healbe-credentials.json inside state. Never commit credentials.
