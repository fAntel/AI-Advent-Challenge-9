user www-data;
worker_processes 1;
pid /run/private-llm-gateway.pid;
error_log stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;
    limit_req_zone $server_name zone=chat_rate:64k rate=6r/m;
    limit_conn_zone $server_name zone=chat_active:64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 30s;

    server {
        listen 127.0.0.1:8080;
        server_name private-llm;
        client_max_body_size 16k;
        client_body_timeout 15s;
        client_header_timeout 15s;

        location = /health {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /v1/models {
            proxy_pass http://127.0.0.1:8081;
        }
        location = /v1/chat/completions {
            limit_except POST { deny all; }
            limit_req zone=chat_rate;
            limit_req_status 429;
            limit_conn chat_active 1;
            limit_conn_status 429;
            error_page 429 = @busy;
            proxy_pass http://127.0.0.1:8081;
        }
        location @busy {
            default_type application/json;
            add_header Retry-After 10 always;
            return 429 '{"error":{"message":"Rate limit exceeded or server busy"}}';
        }
        location / {
            return 404;
        }
    }
}
